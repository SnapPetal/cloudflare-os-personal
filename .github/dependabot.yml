# Dependabot is intentionally disabled on this fork.
# Dependency maintenance happens upstream at cloudflare/cloudflare-os-starter;
# this fork tracks upstream and only carries personal wrapper changes.
# See docs/upstream-sync.md for the sync workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    enabled: false
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    enabled: false
