name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and Cloudflare OS submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Apply personal Cloudflare OS patches
        run: pnpm apply:patches

      - name: Install deployment wrapper dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cloudflare OS dependencies
        run: pnpm --dir cloudflare-os install --frozen-lockfile

      - name: Check generated Worker configs
        run: pnpm --dir cloudflare-os configs:check

      - name: Check the release manifest golden file
        working-directory: cloudflare-os
        run: node --test scripts/release/manifest-lib.test.ts

      - name: Lint repository and upstream code
        run: pnpm lint

      - name: Type-check wrapper packages
        run: pnpm types:check

      - name: Validate deployment
        run: pnpm check

      - name: Deploy Workers except Family Quest
        run: pnpm deploy -- --skip-family-quest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Before the Family Quest upload: apply D1 migrations (0001 plus the SRD seed in
      # 0002–0010). Sign-in is Cloudflare Access, so this step sets no Worker secrets.
      #   wrangler d1 migrations apply thonbecker-family-quest --remote
      - name: Apply Family Quest D1 migrations
        run: bash scripts/family-quest-predeploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Family Quest
        run: pnpm deploy -- --only-family-quest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
