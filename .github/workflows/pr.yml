name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and Cloudflare OS submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install deployment wrapper dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cloudflare OS dependencies
        run: pnpm --dir cloudflare-os install --frozen-lockfile

      - name: Lint repository and upstream code
        run: pnpm lint

      - name: Type-check wrapper packages
        run: pnpm types:check

      - name: Validate deployment
        run: pnpm check
